name: Android APK

# Builds the Android app (the static export packed into an APK with Capacitor) and
# publishes it as the "Stardeck for Android" release, so it can be downloaded
# straight onto a phone from the repo's Releases page.

on:
  push:
    branches: [main, claude/next-gen-social-design-app-ngcznj]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish the APK as a release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Use a private signing key, if one is set up
        env:
          KEYSTORE_BASE64: ${{ secrets.STARDECK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STARDECK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STARDECK_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "STARDECK_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "STARDECK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "STARDECK_KEY_PASSWORD=$KEYSTORE_PASSWORD"
              echo "STARDECK_KEY_ALIAS=$KEY_ALIAS"
            } >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        working-directory: android
        env:
          STARDECK_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - run: cp android/app/build/outputs/apk/release/app-release.apk Stardeck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Stardeck-apk
          path: Stardeck.apk
          retention-days: 30

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-latest
        run: |
          version=$(node -p "require('./package.json').version")
          notes="Stardeck $version for Android, build ${{ github.run_number }} from ${GITHUB_SHA::7}.

          **Install:** download **Stardeck.apk** below on your Android phone, open it, and allow installs from your browser or Files app if Android asks. New builds install over the old one and keep your designs.

          Everything runs on your phone: no account, no watermark, works offline."
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" Stardeck.apk --target "$GITHUB_SHA" --title "Stardeck for Android" --notes "$notes" --latest
